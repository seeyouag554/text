[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-text-pipeline"
version = "0.1.0"
description = "Utilities for preparing speech-text datasets"
authors = [{ name = "OpenAI Assistant" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.urls]
Homepage = "https://example.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["text_pipeline*"]
